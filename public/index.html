<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8 BALL CLUB</title><link rel="stylesheet" href="style.css"></head><body>
<div class="bgglow"></div><main class="shell">
<header><div class="brand"><div class="logo">8</div><div><div class="kicker">REAL-TIME MULTIPLAYER</div><h1>8 BALL <span>CLUB</span></h1></div></div><div id="connection" class="connection"><i></i> 연결 중</div></header>
<section id="lobby" class="lobby glass"><div class="intro"><div class="tag">PLAY WITH FRIENDS</div><h2>친구랑 한 판 붙자.</h2><p>방을 만들고 코드를 공유하면 바로 대결할 수 있어.</p></div><label>닉네임<input id="nickname" maxlength="12" value="플레이어"></label><div class="lobby-actions"><button id="create" class="primary">새 게임 만들기 <b>↗</b></button><div class="join"><input id="roomCode" maxlength="6" placeholder="초대 코드 6자리"><button id="join">참가하기</button></div></div><div class="rules-mini"><span>● 1 VS 1</span><span>● 8 BALL RULES</span><span>● PC / MOBILE</span></div></section>
<section id="game" class="hidden"><div class="topline glass"><div><div class="tiny">ROOM CODE</div><strong id="codeLabel">------</strong><button id="copy" class="copy">복사</button></div><div class="players"><div class="player"><span class="avatar">YOU</span><div><small>PLAYER 1</small><b id="meName">나</b></div></div><div class="versus">VS</div><div class="player"><span class="avatar enemy">P2</span><div><small>PLAYER 2</small><b id="opName">대기 중</b></div></div></div><div id="turnLabel" class="turn">대기 중</div></div>
<div class="table-shell"><div class="table-rail"><canvas id="table" width="900" height="500"></canvas></div></div>
<div class="bottom glass"><div class="status"><div class="status-dot"></div><div><b id="status">친구를 기다리는 중</b><small id="help">초대 코드를 친구에게 보내줘.</small></div></div><div class="bottom-actions"><button id="reset" class="quiet">로비로</button></div></div></section>
<footer>8 BALL CLUB <span>· 친구와 즐기는 온라인 포켓볼</span></footer></main><div id="toast"></div><script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
